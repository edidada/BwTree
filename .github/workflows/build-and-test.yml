name: Build and Test

on:
  push:
    branches:
      - 'edidada/**'
  pull_request:
    branches:
      - 'edidada/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # g++ and make are preinstalled on ubuntu-22.04 runners; no apt needed.
      # The Makefile defaults to g++-5 + libpapi + jemalloc preload; override
      # all three. bwtree.h uses fprintf/stdout without <cstdio>, and accesses
      # private base members from derived templates (accepted by g++-5, an
      # error on modern g++), so inject the header and relax access checking.
      - name: Prepare build directories
        run: make prepare PAPI_FLAG=-DNO_USE_PAPI

      # GMON_FLAG lands at the end of the link command, so -latomic resolves
      # the __atomic_load_16 / __atomic_compare_exchange_16 calls emitted for
      # the 16-byte std::atomic (g++-5 inlined them, g++-11 uses libatomic).
      - name: Compile
        run: make -j2 CXX="g++ -include cstdio -fno-access-control" PAPI_FLAG=-DNO_USE_PAPI PRELOAD_LIB= GMON_FLAG=-latomic

      - name: Run test suite
        run: make test CXX="g++ -include cstdio -fno-access-control" PAPI_FLAG=-DNO_USE_PAPI PRELOAD_LIB= GMON_FLAG=-latomic
